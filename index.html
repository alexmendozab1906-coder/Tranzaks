<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tranzaks - POS con Actualización por Sección</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="container mx-auto p-6 max-w-4xl">
        <header class="flex justify-between items-center mb-8 bg-white p-4 rounded-lg shadow">
            <h1 class="text-2xl font-bold text-gray-800">Tranzaks POS</h1>
            <div class="space-x-2">
                <button onclick="cambiarSeccion('ventas')" class="bg-blue-600 text-white px-3 py-1 rounded text-sm font-medium">Ventas</button>
                <button onclick="cambiarSeccion('inventario')" class="bg-gray-600 text-white px-3 py-1 rounded text-sm font-medium">Inventario</button>
                <button onclick="cambiarSeccion('configuracion')" class="bg-gray-600 text-white px-3 py-1 rounded text-sm font-medium">Configuración</button>
            </div>
        </header>

        <!-- SECCIÓN: VENTAS -->
        <div id="seccion-ventas" class="seccion-app grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-lg shadow">
                <h2 class="text-lg font-semibold mb-4 text-gray-700">Procesar Venta</h2>
                <button onclick="simularVenta()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-medium transition">
                    Completar Venta y Sincronizar
                </button>
            </div>
            <div class="bg-white p-6 rounded-lg shadow">
                <h2 class="text-lg font-semibold mb-4 text-gray-700">Estado de Sincronización</h2>
                <p id="estado-conexion" class="text-gray-600 mb-2">Listo para interactuar.</p>
                <div class="text-sm font-semibold text-indigo-600 bg-indigo-50 p-3 rounded-lg border border-indigo-100">
                    🔄 Última actualización al cambiar sección: <span id="timestamp-sync">Ninguna todavía</span>
                </div>
            </div>
        </div>

        <!-- SECCIÓN: INVENTARIO (Oculta por defecto) -->
        <div id="seccion-inventario" class="seccion-app hidden bg-white p-6 rounded-lg shadow">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">Gestión de Inventario</h2>
            <p class="text-gray-600">Aquí se mostrará el inventario actualizado desde Google Drive.</p>
        </div>

        <!-- SECCIÓN: CONFIGURACIÓN (Oculta por defecto) -->
        <div id="seccion-configuracion" class="seccion-app hidden bg-white p-6 rounded-lg shadow">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">Configuración del Sistema</h2>
            <button onclick="ejecutarAccionProtegida(cerrarCaja)" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded font-medium transition">
                Cerrar Caja (Protegido)
            </button>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "TU_URL_DE_GOOGLE_APPS_SCRIPT_AQUI";

        // Función para cambiar de sección y actualizar automáticamente al cambiar
        function cambiarSeccion(nombreSeccion) {
            // Ocultar todas las secciones
            document.querySelectorAll('.seccion-app').forEach(el => el.classList.add('hidden'));
            
            // Mostrar la sección seleccionada
            document.getElementById(`seccion-${nombreSeccion}`).classList.remove('hidden');

            // Actualizar estilos de los botones de navegación opcionalmente
            console.changedSection = nombreSeccion;

            // Disparar la sincronización inmediatamente al cambiar de sección
            sincronizarDatos();
        }

        // Función de sincronización con Google Drive
        async function sincronizarDatos() {
            try {
                document.getElementById("estado-conexion").innerText = "Actualizando datos...";
                const response = await fetch(`${WEB_APP_URL}?accion=obtenerEstado`);
                const resultado = await response.json();
                
                if (resultado.exito) {
                    actualizarTimestamp();
                    document.getElementById("estado-conexion").innerText = "Sincronizado con Drive correctamente.";
                }
            } catch (error) {
                console.error("Error en la sincronización:", error);
                document.getElementById("estado-conexion").innerText = "Error al actualizar al cambiar de sección.";
            }
        }

        function actualizarTimestamp() {
            const ahora = new Date();
            document.getElementById("timestamp-sync").innerText = ahora.toLocaleTimeString();
        }

        // Sistema de Seguridad por NIP
        async function verificarNIPOperacion(nipIngresado) {
            try {
                const response = await fetch(`${WEB_APP_URL}?accion=verificarNIP&nip=${nipIngresado}`);
                const resultado = await response.json();
                return resultado.autorizado;
            } catch (error) {
                console.error("Error al validar el NIP:", error);
                return false;
            }
        }

        async function ejecutarAccionProtegida(accionCallback) {
            const nip = prompt("Ingresa el NIP de autorización de gerente:");
            if (!nip) return;

            const autorizado = await verificarNIPOperacion(nip);
            if (autorizado) {
                await accionCallback();
            } else {
                alert("NIP incorrecto o sin permisos suficientes.");
            }
        }

        async function cerrarCaja() {
            alert("Acción autorizada: Caja cerrada correctamente.");
        }

        // Procesamiento de Venta
        async function procesarVentaTranzaks(carritoItems, descuentoGlobal = 0) {
            let totalVenta = 0;
            const itemsProcesados = carritoItems.map(item => {
                const precioConDescuento = item.precioUnitario - (item.descuentoUnitario || 0);
                const subtotal = precioConDescuento * item.cantidad;
                totalVenta += subtotal;
                return { ...item, precioConDescuento, subtotal };
            });

            const totalFinal = totalVenta - descuentoGlobal;
            const datosVenta = {
                tipo: "registrarVenta",
                items: itemsProcesados,
                total: totalFinal,
                fecha: new Date().toISOString()
            };

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify(datosVenta)
                });
                const resultado = await response.json();
                
                if (resultado.exito) {
                    alert("¡Venta registrada y guardada en Google Drive!");
                    sincronizarDatos();
                } else {
                    alert("Hubo un problema al registrar la venta.");
                }
            } catch (error) {
                console.error("Error de red:", error);
                alert("Error al conectar con Google Drive.");
            }
        }

        async function simularVenta() {
            const carritoEjemplo = [
                { id: "producto_1", nombre: "Artículo A", precioUnitario: 100, descuentoUnitario: 10, cantidad: 2 },
                { id: "producto_2", nombre: "Artículo B", precioUnitario: 50, descuentoUnitario: 0, cantidad: 1 }
            ];
            await procesarVentaTranzaks(carritoEjemplo, 5);
        }
    </script>
</body>
</html>
