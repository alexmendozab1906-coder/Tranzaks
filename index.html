<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Clientes</title>
    <style>
        .client-section {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        .client-section h2 {
            text-align: center;
            color: #333;
        }
        .client-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-group label {
            font-weight: bold;
            color: #555;
        }
        .form-group input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-submit {
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
        .client-table-container {
            overflow-x: auto;
        }
        .client-table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }
        .client-table th, .client-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .client-table th {
            background-color: #007bff;
            color: white;
        }
        .client-table tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>

    <div class="client-section">
        <h2>Registro de Clientes</h2>
        
        <!-- Formulario de Registro -->
        <form id="clientForm" class="client-form">
            <div class="form-group">
                <label for="clientName">Nombre del Cliente:</label>
                <input type="text" id="clientName" required placeholder="Ej. Juan Pérez">
            </div>
            
            <div class="form-group">
                <label for="clientPhone">Número Telefónico:</label>
                <input type="tel" id="clientPhone" required placeholder="Ej. 8112345678">
            </div>
            
            <button type="submit" class="btn-submit">Registrar Cliente</button>
        </form>

        <!-- Tabla de Clientes Registrados -->
        <div class="client-table-container">
            <table class="client-table">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Teléfono</th>
                    </tr>
                </thead>
                <tbody id="clientTableBody">
                    <!-- Los registros se agregarán aquí dinámicamente -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const clientForm = document.getElementById('clientForm');
        const clientTableBody = document.getElementById('clientTableBody');

        clientForm.addEventListener('submit', function(e) {
            e.preventDefault(); // Evita que la página se recargue

            // Obtener los valores de los inputs
            const name = document.getElementById('clientName').value;
            const phone = document.getElementById('clientPhone').value;

            // Crear una nueva fila en la tabla
            const newRow = document.createElement('tr');

            const nameCell = document.createElement('td');
            nameCell.textContent = name;
            
            const phoneCell = document.createElement('td');
            phoneCell.textContent = phone;

            // Añadir las celdas a la fila
            newRow.appendChild(nameCell);
            newRow.appendChild(phoneCell);

            // Añadir la fila al cuerpo de la tabla
            clientTableBody.appendChild(newRow);

            // Limpiar el formulario
            clientForm.reset();
        });
    </script>

</body>
</html>
